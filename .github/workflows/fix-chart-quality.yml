name: Fix chart quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch chart capture and Render memory
        shell: python
        run: |
          from pathlib import Path
          import re

          chart = Path("services/chart.py")
          text = chart.read_text(encoding="utf-8")

          # Playwright sync API + signal.alarm is unsafe together. The alarm
          # was causing RouteHandler.handle() to be interrupted and then EPIPE.
          text = re.sub(r'^import signal\s*\n', '', text, flags=re.M)
          text = re.sub(r'^\s*signal\.alarm\([^\n]*\)\s*\n', '', text, flags=re.M)
          text = re.sub(r'^\s*signal\.signal\([^\n]*\)\s*\n', '', text, flags=re.M)

          # Render Free does not need request interception for Elite charts.
          # Removing page.route() also avoids route-coroutine failures and saves RAM.
          if "    def _block_ads(self, page):" in text:
              start = text.index("    def _block_ads(self, page):")
              end = text.index("    def _safe_click", start)
              text = text[:start] + '''    def _block_ads(self, page):
        # Disabled on Render Free: page.route() interception plus hard signals
        # was causing Playwright coroutine/EPIPE failures and extra RAM usage.
        return

''' + text[end:]

          # Keep high-quality chart capture, but do not force 2x device scale on 512 MB.
          start = text.index("    def _capture_chart(self, page):")
          end = text.index("\n\ndef get_chart_and_info", start)

          new_func = '''    def _capture_chart(self, page):
        """Quality-first capture with a low-RAM browser fallback."""
        log("[Chart] High-quality canvas screenshot -> asosiy usul")

        chart = self._find_chart(page)
        if chart:
            try:
                box = chart.bounding_box()
                if box:
                    log(f"[Chart] Chart size: {int(box['width'])}x{int(box['height'])}")
                    if box["width"] >= 700 and box["height"] >= 300:
                        img = chart.screenshot(type="png", animations="disabled")
                        from PIL import Image
                        import io as _io
                        im = Image.open(_io.BytesIO(img))
                        log(f"[Chart] Screenshot: {im.width}x{im.height}, {len(img)//1024} KB")
                        if im.width >= 900 and im.height >= 400 and not _is_image_dark(img):
                            log("[Chart] High-quality canvas screenshot OK")
                            return img
            except Exception as e:
                log(f"[Chart] Canvas screenshot failed: {e}")

        log("[Chart] Canvas yetarli bo'lmasa -> Share->Download fallback")
        try:
            img = self._capture_via_share_download(page)
            if img:
                return img
        except Exception as e:
            log(f"[Chart] Share->Download failed: {e}")

        chart = self._find_chart(page)
        if chart:
            try:
                img = chart.screenshot(type="png", animations="disabled")
                if not _is_image_dark(img):
                    log(f"[Chart] Final screenshot OK ({len(img)//1024} KB)")
                    return img
            except Exception as e:
                log(f"[Chart] Final screenshot failed: {e}")

        return None
'''

          text = text[:start] + new_func + text[end:]
          chart.write_text(text, encoding="utf-8")

          browser = Path("services/browser.py")
          b = browser.read_text(encoding="utf-8")
          b = b.replace('"viewport": {"width": 1600, "height": 1200},', '"viewport": {"width": 1200, "height": 900},')
          b = b.replace('"device_scale_factor": 2,', '"device_scale_factor": 1,')
          b = b.replace('"device_scale_factor": 1,', '"device_scale_factor": 1,')
          b = b.replace('"width": 1600,\n            "height": 1200', '"width": 1200,\n            "height": 900')
          browser.write_text(b, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/chart.py services/browser.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix Playwright timeout and reduce chart RAM usage"
          git push
